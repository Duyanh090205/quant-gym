<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant Gym</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f7f7f5; --surface:#fff; --surface-2:#eeefeb; --line:#dfe2da;
  --fg:#14181e; --fg-2:#39424d; --fg-3:#6d7783;
  --accent:#1f6f5c; --accent-soft:#dcece6; --warn:#b4600f; --warn-soft:#f6e8d5;
  --bad:#a33827; --bad-soft:#f6dfda;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1116; --surface:#161b22; --surface-2:#1e242d; --line:#2b333d;
  --fg:#e9ebe7; --fg-2:#c3c9cf; --fg-3:#8c959f;
  --accent:#4fbf9f; --accent-soft:#12302a; --warn:#e2a459; --warn-soft:#33260f;
  --bad:#e0715c; --bad-soft:#3a1d18;
}}
:root[data-theme=dark]{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1e242d; --line:#2b333d;
  --fg:#e9ebe7; --fg-2:#c3c9cf; --fg-3:#8c959f;
  --accent:#4fbf9f; --accent-soft:#12302a; --warn:#e2a459; --warn-soft:#33260f;
  --bad:#e0715c; --bad-soft:#3a1d18;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:24px 18px 72px}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);
       background:var(--surface);color:var(--fg);padding:9px 14px;transition:border-color .12s,background .12s}
button:hover{border-color:var(--fg-3)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.small{font-size:12.5px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 11px;font-size:13px;background:var(--surface);color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);font-weight:600}

.topic{margin-bottom:26px}
.topic-head{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
       display:flex;flex-direction:column;gap:9px}
.skill-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.levels{display:flex;gap:6px}
.lvl{flex:1;padding:7px 0;font-family:var(--mono);font-size:12.5px;text-align:center}
.lvl[data-done=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dot[data-on=true]{background:var(--accent);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tip{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:15px 16px;
     display:flex;flex-direction:column;gap:9px}
.tip h3{color:var(--fg)}
.tip ol{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:4px;color:var(--fg-2)}
.tip .ex{background:var(--surface);border-radius:6px;padding:10px 12px;display:flex;
         flex-direction:column;gap:6px}
.tip .ex + .ex{margin-top:-3px}
.tip .exask{font-size:14px;color:var(--fg);font-weight:500}
.tip .exwork{font-family:var(--mono);font-size:12.5px;color:var(--fg-2);overflow-x:auto;
             white-space:pre-wrap;line-height:1.6}
.tip .when{background:var(--surface);border-left:3px solid var(--warn);border-radius:0 6px 6px 0;
           padding:8px 11px;color:var(--fg-2);font-size:14px}
.tip .when strong{color:var(--fg)}

.recognise{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px}
.recognise summary{cursor:pointer;padding:10px 13px;font-weight:600;font-size:13.5px;list-style-position:inside}
.recognise summary::marker{color:var(--fg-3)}
.recognise[open] summary{border-bottom:1px solid var(--line)}
.reclist{display:flex;flex-direction:column}
.recrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;padding:9px 13px;
        font-size:13px;align-items:baseline}
.recrow+.recrow{border-top:1px solid var(--surface-2)}
.recwhen{color:var(--fg-2)}
.rectitle{color:var(--fg-3)}
@media (max-width:560px){.recrow{grid-template-columns:1fr;gap:2px}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}

.qbig{font-family:var(--mono);font-size:clamp(22px,4.6vw,32px);font-weight:500;letter-spacing:-.03em;
      line-height:1.25;word-break:break-word}
.qbig.words{font-family:var(--sans);font-size:clamp(16px,2.6vw,19px);font-weight:450;line-height:1.5}
input[type=text]{font-family:var(--mono);font-size:19px;padding:10px 12px;background:var(--surface-2);
  color:var(--fg);border:1px solid var(--line);border-radius:var(--r);width:min(240px,100%);
  font-variant-numeric:tabular-nums}
.verdict{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid}
.verdict.ok{background:var(--accent-soft);border-color:var(--accent)}
.verdict.no{background:var(--bad-soft);border-color:var(--bad)}
.solution{background:var(--surface);border-radius:8px;padding:10px 12px;display:flex;
          flex-direction:column;gap:4px}
.solution .eyebrow{color:var(--fg-3)}
.rail{height:4px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rail.hot i{background:var(--bad)}
.clock{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.clock.hot{color:var(--bad)}

.sheet{display:grid;gap:8px}
.sheet.two{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.qrow{display:grid;grid-template-columns:24px 1fr 110px;gap:10px;align-items:center;background:var(--surface);
      border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.qrow.words{grid-template-columns:24px 1fr}
.qrow.words input{grid-column:2}
.qn{font-family:var(--mono);font-size:11px;color:var(--fg-3);text-align:right}
.qq{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;word-break:break-word}
.qrow.words .qq{font-family:var(--sans);font-size:14.5px;line-height:1.45}
.qrow input{width:100%;font-size:15px;padding:6px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:12px 13px}
.tile .tv{font-family:var(--mono);font-size:23px;font-weight:650;letter-spacing:-.02em}
.tile .tl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.review{display:flex;flex-direction:column;gap:8px}
.rev{border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:10px 12px;background:var(--surface)}
.rev[data-ok=true]{border-left-color:var(--accent)}
.rev[data-ok=false]{border-left-color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const __shared = {};
/* ── src/engine/format.js ─────────────────────────────────── */
(() => {
/**
 * Number formatting and answer parsing.
 *
 * Students type answers, they do not pick from options. So the parser has to be
 * generous about how a human writes a number, and strict about what counts as
 * the same value.
 */

/** Round to 4 decimal places, dropping float noise like 0.30000000000000004. */
const round4 = (x) => Math.round(x * 10000) / 10000;

/** Display a number the way a person would write it. */
function fmt(x) {
  if (typeof x === "string") return x;
  if (!isFinite(x)) return String(x);
  return Number.isInteger(x) ? String(x) : String(round4(x));
}

/**
 * Probabilities read better as fractions, expectations as decimals.
 * Anything below 1 is searched for a small denominator; 6/11 beats 0.545.
 */
function frac(x, maxDen = 130) {
  if (!isFinite(x)) return String(x);
  if (x === 0) return "0";
  if (Math.abs(x) >= 1) return String(Math.round(x * 100) / 100);
  for (let d = 2; d <= maxDen; d++) {
    const n = Math.round(x * d);
    if (n !== 0 && Math.abs(n / d - x) < 1e-9) return `${n}/${d}`;
  }
  return String(Math.round(x * 1000) / 1000);
}

/**
 * Parse what the student typed.
 *
 * Understood: `1234`, `1,234`, `12.5`, `12,5` (comma decimal), `3/8`, `40%`,
 * leading `+`/`-`, stray spaces. Anything else comes back as an upper-cased
 * string, which is what letter-sequence answers need.
 *
 * Returns a number, a string, or null for empty input.
 */
function parseAnswer(raw) {
  if (raw == null) return null;
  let s = String(raw).trim();
  if (!s) return null;

  s = s.replace(/\s+/g, "");
  const isPercent = s.endsWith("%");
  if (isPercent) s = s.slice(0, -1);

  // 1,234 is a thousands separator; 0,5 is a decimal comma. Strip the first,
  // convert the second.
  s = s.replace(/,(\d{3})(?!\d)/g, "$1").replace(",", ".");

  if (!/^[-+]?[\d.]*\/?[-+]?[\d.]+$/.test(s)) {
    return String(raw).trim().toUpperCase();
  }

  let v;
  if (s.includes("/")) {
    const [n, d] = s.split("/");
    v = parseFloat(n) / parseFloat(d);
  } else {
    v = parseFloat(s);
  }

  if (!isFinite(v)) return String(raw).trim().toUpperCase();
  return isPercent ? v / 100 : v;
}

/** Compare with both a relative and an absolute tolerance. */
function near(a, b, rel = 0, abs = 0.0051) {
  return Math.abs(a - b) <= Math.max(abs, rel * Math.abs(b));
}

/** Normalise a typed string for letter answers: "  hs " and "HS" are equal. */
const normal = (s) => String(s).trim().replace(/\s+/g, "").toUpperCase();

const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LETTERS = "abcdefghij";

/** n! for the small n this engine uses. */
function fact(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Binomial coefficient. */
function choose(n, k) {
  if (k < 0 || k > n) return 0;
  return fact(n) / (fact(k) * fact(n - k));
}

/** Ordinal suffix: 1 → "1st". Used in question prompts. */
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

Object.assign(__shared, { fmt, frac, parseAnswer, near, fact, choose, ordinal, round4, normal, ALPHA, LETTERS });
})();

/* ── src/engine/rng.js ─────────────────────────────────── */
(() => {
/**
 * Seeded random number generator.
 *
 * Every question in Quant Gym is produced from a seed, so the same seed always
 * yields the same paper. That is what makes classroom assignments possible:
 * a teacher shares the code `QG-7A3F` and all thirty students sit the same set,
 * with no server and no database of questions.
 */

/** Turn any string into a 32-bit integer. */
function hashSeed(seed) {
  let h = 2166136261 >>> 0;
  const s = String(seed);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

/**
 * Create a deterministic RNG. `mulberry32` is small, fast and has a long
 * enough period for exam papers; it is not cryptographic and does not need to be.
 */
function makeRng(seed) {
  let a = hashSeed(seed);
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  return {
    /** Float in [0, 1). */
    float: next,
    /** Integer in [lo, hi], both inclusive. */
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    /** One element of `arr`. Repeat an element to weight it. */
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    /** Fisher-Yates, in place, returns the same array. */
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
    /** True with probability p. */
    chance: (p) => next() < p,
  };
}

/** Human-friendly assignment code, e.g. "QG-7A3F". Ambiguous glyphs removed. */
function makeCode(seed = Date.now() + ":" + Math.random()) {
  const ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  let h = hashSeed(seed);
  let out = "";
  for (let i = 0; i < 4; i++) {
    out += ALPHABET[h % ALPHABET.length];
    h = Math.floor(h / ALPHABET.length) + 7919;
  }
  return "QG-" + out;
}

Object.assign(__shared, { hashSeed, makeRng, makeCode });
})();

/* ── src/engine/tips.js ─────────────────────────────────── */
(() => {
/**
 * Tip cards.
 *
 * A tip card is shown twice: once before the first drill of a level, and again
 * the moment a student gets a question wrong that this tip covers. The second
 * showing is the one that teaches. A trick delivered while the mistake is still
 * warm sticks; the same trick in a textbook chapter does not.
 *
 * Every card is bilingual. English is the default; `vi` exists because most of
 * the first cohort reads Vietnamese faster than English, and a student should
 * never lose a maths point to a language gap.
 *
 * Each card opens with `when`: the sentence telling you that this is the card
 * this question wants. For arithmetic that is nearly automatic — you see 37² and
 * you reach for the square rule. For probability it is the whole difficulty. A
 * student who knows all seven probability ideas and cannot tell which one a
 * question is asking for will still score nothing, so recognition comes first on
 * the card, before any method.
 *
 * `examples` is a list of `{ ask, work }`, and both splits are deliberate. Left
 * as one string these decayed into answer keys — "first to roll a 6: p = 1/6, so
 * 6/11" — which only make sense to a reader who already knows the puzzle. And
 * welding several questions into one line ("What are 48 × 5, 36 × 11 and 78 × 11?")
 * asks a beginner to track three problems at once. One block, one question.
 */

const TIPS = [
  {
    id: "subtract-hundreds-first",
    skill: "arith.add-subtract",
    en: {
      title: "Work from the left, and say each running total out loud",
      when: "Any addition or subtraction with three digits or more.",
      steps: [
        "Deal with the big part before the small part: hundreds, then tens, then units.",
        "Say the intermediate number to yourself. That is what stops you dropping a hundred.",
        "Then deal with what is left. It works the same way for adding.",
      ],
      examples: [
        { ask: "What is 823 − 467?",
          work: "823 − 400 = 423, then 423 − 60 = 363, then 363 − 7 = 356" },
        { ask: "What is 4236 + 2891?",
          work: "4236 + 2000 = 6236, then 6236 + 800 = 7036, then 7036 + 90 = 7126, then 7126 + 1 = 7127" },
      ],
      why: "Rounding up and adding back feels clever but loses a whole hundred when you are rushed. Going left to right never does.",
    },
    vi: {
      title: "Làm từ trái sang phải, và đọc to từng số trung gian",
      when: "Mọi phép cộng trừ từ ba chữ số trở lên.",
      steps: [
        "Xử lý phần lớn trước, phần nhỏ sau: hàng trăm, rồi hàng chục, rồi hàng đơn vị.",
        "Đọc thầm số trung gian. Đó là thứ giữ cho bạn không rơi mất một trăm.",
        "Rồi làm nốt phần còn lại. Phép cộng cũng đi y hệt như vậy.",
      ],
      examples: [
        { ask: "823 − 467 bằng bao nhiêu?",
          work: "823 − 400 = 423, rồi 423 − 60 = 363, rồi 363 − 7 = 356" },
        { ask: "4236 + 2891 bằng bao nhiêu?",
          work: "4236 + 2000 = 6236, rồi 6236 + 800 = 7036, rồi 7036 + 90 = 7126, rồi 7126 + 1 = 7127" },
      ],
      why: "Cách làm tròn lên rồi cộng bù nghe thông minh nhưng lúc vội rất hay mất nguyên một trăm. Đi từ trái sang phải thì không bao giờ.",
    },
  },
  {
    id: "split-and-add",
    skill: "arith.multiply",
    en: {
      title: "Split the second number, multiply twice, add",
      when: "Any multiplication where a number has two digits or more.",
      steps: [
        "Break one of the two factors into its tens and its units. Pick whichever splits more cleanly.",
        "Multiply each part separately.",
        "Add the two results.",
      ],
      examples: [
        { ask: "What is 17 × 54?",
          work: "17 × 50 = 850 and 17 × 4 = 68, so 850 + 68 = 918" },
      ],
      why: "Two easy multiplications beat one hard one. You are never holding more than three digits in your head.",
    },
    vi: {
      title: "Tách số thứ hai, nhân hai lần, rồi cộng",
      when: "Mọi phép nhân có số từ hai chữ số trở lên.",
      steps: [
        "Tách một trong hai thừa số thành hàng chục và hàng đơn vị. Chọn cái nào tách gọn hơn.",
        "Nhân từng phần riêng.",
        "Cộng hai kết quả lại.",
      ],
      examples: [
        { ask: "17 × 54 bằng bao nhiêu?",
          work: "17 × 50 = 850 và 17 × 4 = 68, nên 850 + 68 = 918" },
      ],
      why: "Hai phép nhân dễ hơn một phép nhân khó. Bạn không bao giờ phải nhớ quá ba chữ số trong đầu.",
    },
  },
  {
    id: "times-five-and-eleven",
    skill: "arith.multiply",
    en: {
      title: "Turn an awkward multiplier into a 10 or a 100, then adjust",
      when: "The moment you spot a 5, 9, 11, 25, 50 or 99 in the question.",
      steps: [
        "Every awkward multiplier here is a round number with a small adjustment: 5 = 10 ÷ 2, 50 = 100 ÷ 2, 25 = 100 ÷ 4.",
        "9 = 10 − 1 and 99 = 100 − 1, so multiply by the round number and take one copy off. 11 = 10 + 1, so add one copy on.",
        "For ×11 on a two-digit number there is a faster way still: keep the outer digits and put their sum between them, carrying if that sum reaches 10.",
      ],
      examples: [
        { ask: "What is 48 × 5?",
          work: "48 × 10 = 480, then halve it: 240" },
        { ask: "What is 36 × 11?",
          work: "Keep the 3 and the 6, put their sum in the middle: 3 (3+6) 6 = 396" },
        { ask: "What is 78 × 11, where the middle sum passes 10?",
          work: "7 (7+8) 8 = 7 (15) 8. The 15 does not fit, so carry the 1 into the 7: 858" },
        { ask: "What is 34 × 9?",
          work: "9 is one short of 10. So 34 × 10 = 340, then take one copy of 34 off: 340 − 34 = 306" },
      ],
      why: "Both turn a multiplication into an addition or a halving, which are far faster under a clock.",
    },
    vi: {
      title: "Biến số nhân khó chịu thành 10 hoặc 100, rồi chỉnh lại",
      when: "Ngay khi thấy 5, 9, 11, 25, 50 hay 99 trong đề.",
      steps: [
        "Mọi số nhân khó chịu ở đây đều là số tròn kèm một chỉnh nhỏ: 5 = 10 ÷ 2, 50 = 100 ÷ 2, 25 = 100 ÷ 4.",
        "9 = 10 − 1 và 99 = 100 − 1, nên nhân với số tròn rồi bớt đi một lần. 11 = 10 + 1, nên cộng thêm một lần.",
        "Riêng ×11 với số hai chữ số còn có cách nhanh hơn: giữ hai chữ số ngoài, đặt tổng của chúng vào giữa, nhớ 1 nếu tổng đó từ 10 trở lên.",
      ],
      examples: [
        { ask: "48 × 5 bằng bao nhiêu?",
          work: "48 × 10 = 480, rồi chia đôi: 240" },

const BY_ID = new Map(TIPS.map((t) => [t.id, t]));
const BY_SKILL = TIPS.reduce((m, t) => {
  (m[t.skill] ||= []).push(t);
  return m;
}, {});

/** One tip card, already resolved to a language. Returns null for unknown ids. */
function getTip(id, lang = "en") {
  const t = BY_ID.get(id);
  if (!t) return null;
  return { id: t.id, skill: t.skill, ...(t[lang] || t.en) };
}

/** Every tip attached to a skill, resolved to a language. */
function tipsForSkill(skillId, lang = "en") {
  return (BY_SKILL[skillId] || []).map((t) => getTip(t.id, lang));
}

Object.assign(__shared, { getTip, tipsForSkill, TIPS });
