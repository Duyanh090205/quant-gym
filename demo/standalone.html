<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quant Gym</title>
<style>
:root{
  --bg:#f7f7f5; --surface:#fff; --surface-2:#eeefeb; --line:#dfe2da;
  --fg:#14181e; --fg-2:#39424d; --fg-3:#6d7783;
  --accent:#1f6f5c; --accent-soft:#dcece6; --warn:#b4600f; --warn-soft:#f6e8d5;
  --bad:#a33827; --bad-soft:#f6dfda;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1116; --surface:#161b22; --surface-2:#1e242d; --line:#2b333d;
  --fg:#e9ebe7; --fg-2:#c3c9cf; --fg-3:#8c959f;
  --accent:#4fbf9f; --accent-soft:#12302a; --warn:#e2a459; --warn-soft:#33260f;
  --bad:#e0715c; --bad-soft:#3a1d18;
}}
:root[data-theme=dark]{
  --bg:#0e1116; --surface:#161b22; --surface-2:#1e242d; --line:#2b333d;
  --fg:#e9ebe7; --fg-2:#c3c9cf; --fg-3:#8c959f;
  --accent:#4fbf9f; --accent-soft:#12302a; --warn:#e2a459; --warn-soft:#33260f;
  --bad:#e0715c; --bad-soft:#3a1d18;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;
     -webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:24px 18px 72px}
h1,h2,h3{margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
button{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);
       background:var(--surface);color:var(--fg);padding:9px 14px;transition:border-color .12s,background .12s}
button:hover{border-color:var(--fg-3)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.primary:hover{filter:brightness(1.08);border-color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)}
.small{font-size:12.5px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 11px;font-size:13px;background:var(--surface);color:var(--fg-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg);font-weight:600}

.topic{margin-bottom:26px}
.topic-head{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
       display:flex;flex-direction:column;gap:9px}
.skill-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.levels{display:flex;gap:6px}
.lvl{flex:1;padding:7px 0;font-family:var(--mono);font-size:12.5px;text-align:center}
.lvl[data-done=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg);font-weight:600}
.dots{display:flex;gap:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.dot[data-on=true]{background:var(--accent);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tip{background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:15px 16px;
     display:flex;flex-direction:column;gap:9px}
.tip h3{color:var(--fg)}
.tip ol{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:4px;color:var(--fg-2)}
.tip .ex{font-family:var(--mono);font-size:13px;background:var(--surface);border-radius:6px;padding:9px 11px;
         overflow-x:auto;white-space:pre-wrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}

.qbig{font-family:var(--mono);font-size:clamp(22px,4.6vw,32px);font-weight:500;letter-spacing:-.02em;
      line-height:1.25;word-break:break-word}
.qbig.words{font-family:var(--sans);font-size:clamp(16px,2.6vw,19px);font-weight:450;line-height:1.5}
input[type=text]{font-family:var(--mono);font-size:19px;padding:10px 12px;background:var(--surface-2);
  color:var(--fg);border:1px solid var(--line);border-radius:var(--r);width:min(240px,100%);
  font-variant-numeric:tabular-nums}
.verdict{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid}
.verdict.ok{background:var(--accent-soft);border-color:var(--accent)}
.verdict.no{background:var(--bad-soft);border-color:var(--bad)}
.rail{height:4px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rail.hot i{background:var(--bad)}
.clock{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.clock.hot{color:var(--bad)}

.sheet{display:grid;gap:8px}
.sheet.two{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.qrow{display:grid;grid-template-columns:24px 1fr 110px;gap:10px;align-items:center;background:var(--surface);
      border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.qrow.words{grid-template-columns:24px 1fr}
.qrow.words input{grid-column:2}
.qn{font-family:var(--mono);font-size:11px;color:var(--fg-3);text-align:right}
.qq{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;word-break:break-word}
.qrow.words .qq{font-family:var(--sans);font-size:14.5px;line-height:1.45}
.qrow input{width:100%;font-size:15px;padding:6px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile{background:var(--surface);padding:12px 13px}
.tile .tv{font-family:var(--mono);font-size:23px;font-weight:650;letter-spacing:-.02em}
.tile .tl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.review{display:flex;flex-direction:column;gap:8px}
.rev{border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:10px 12px;background:var(--surface)}
.rev[data-ok=true]{border-left-color:var(--accent)}
.rev[data-ok=false]{border-left-color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const __shared = {};
/* ── src/engine/format.js ─────────────────────────────────── */
(() => {
/**
 * Number formatting and answer parsing.
 *
 * Students type answers, they do not pick from options. So the parser has to be
 * generous about how a human writes a number, and strict about what counts as
 * the same value.
 */

/** Round to 4 decimal places, dropping float noise like 0.30000000000000004. */
const round4 = (x) => Math.round(x * 10000) / 10000;

/** Display a number the way a person would write it. */
function fmt(x) {
  if (typeof x === "string") return x;
  if (!isFinite(x)) return String(x);
  return Number.isInteger(x) ? String(x) : String(round4(x));
}

/**
 * Probabilities read better as fractions, expectations as decimals.
 * Anything below 1 is searched for a small denominator; 6/11 beats 0.545.
 */
function frac(x, maxDen = 130) {
  if (!isFinite(x)) return String(x);
  if (x === 0) return "0";
  if (Math.abs(x) >= 1) return String(Math.round(x * 100) / 100);
  for (let d = 2; d <= maxDen; d++) {
    const n = Math.round(x * d);
    if (n !== 0 && Math.abs(n / d - x) < 1e-9) return `${n}/${d}`;
  }
  return String(Math.round(x * 1000) / 1000);
}

/**
 * Parse what the student typed.
 *
 * Understood: `1234`, `1,234`, `12.5`, `12,5` (comma decimal), `3/8`, `40%`,
 * leading `+`/`-`, stray spaces. Anything else comes back as an upper-cased
 * string, which is what letter-sequence answers need.
 *
 * Returns a number, a string, or null for empty input.
 */
function parseAnswer(raw) {
  if (raw == null) return null;
  let s = String(raw).trim();
  if (!s) return null;

  s = s.replace(/\s+/g, "");
  const isPercent = s.endsWith("%");
  if (isPercent) s = s.slice(0, -1);

  // 1,234 is a thousands separator; 0,5 is a decimal comma. Strip the first,
  // convert the second.
  s = s.replace(/,(\d{3})(?!\d)/g, "$1").replace(",", ".");

  if (!/^[-+]?[\d.]*\/?[-+]?[\d.]+$/.test(s)) {
    return String(raw).trim().toUpperCase();
  }

  let v;
  if (s.includes("/")) {
    const [n, d] = s.split("/");
    v = parseFloat(n) / parseFloat(d);
  } else {
    v = parseFloat(s);
  }

  if (!isFinite(v)) return String(raw).trim().toUpperCase();
  return isPercent ? v / 100 : v;
}

/** Compare with both a relative and an absolute tolerance. */
function near(a, b, rel = 0, abs = 0.0051) {
  return Math.abs(a - b) <= Math.max(abs, rel * Math.abs(b));
}

/** Normalise a typed string for letter answers: "  hs " and "HS" are equal. */
const normal = (s) => String(s).trim().replace(/\s+/g, "").toUpperCase();

const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const LETTERS = "abcdefghij";

/** n! for the small n this engine uses. */
function fact(n) {
  let f = 1;
  for (let i = 2; i <= n; i++) f *= i;
  return f;
}

/** Binomial coefficient. */
function choose(n, k) {
  if (k < 0 || k > n) return 0;
  return fact(n) / (fact(k) * fact(n - k));
}

/** Ordinal suffix: 1 → "1st". Used in question prompts. */
function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

Object.assign(__shared, { fmt, frac, parseAnswer, near, fact, choose, ordinal, round4, normal, ALPHA, LETTERS });
})();

/* ── src/engine/rng.js ─────────────────────────────────── */
(() => {
/**
 * Seeded random number generator.
 *
 * Every question in Quant Gym is produced from a seed, so the same seed always
 * yields the same paper. That is what makes classroom assignments possible:
 * a teacher shares the code `QG-7A3F` and all thirty students sit the same set,
 * with no server and no database of questions.
 */

/** Turn any string into a 32-bit integer. */
function hashSeed(seed) {
  let h = 2166136261 >>> 0;
  const s = String(seed);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

/**
 * Create a deterministic RNG. `mulberry32` is small, fast and has a long
 * enough period for exam papers; it is not cryptographic and does not need to be.
 */
function makeRng(seed) {
  let a = hashSeed(seed);
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  return {
    /** Float in [0, 1). */
    float: next,
    /** Integer in [lo, hi], both inclusive. */
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    /** One element of `arr`. Repeat an element to weight it. */
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    /** Fisher-Yates, in place, returns the same array. */
    shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
    /** True with probability p. */
    chance: (p) => next() < p,
  };
}

/** Human-friendly assignment code, e.g. "QG-7A3F". Ambiguous glyphs removed. */
function makeCode(seed = Date.now() + ":" + Math.random()) {
  const ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
  let h = hashSeed(seed);
  let out = "";
  for (let i = 0; i < 4; i++) {
    out += ALPHABET[h % ALPHABET.length];
    h = Math.floor(h / ALPHABET.length) + 7919;
  }
  return "QG-" + out;
}

Object.assign(__shared, { hashSeed, makeRng, makeCode });
})();

/* ── src/engine/tips.js ─────────────────────────────────── */
(() => {
/**
 * Tip cards.
 *
 * A tip card is shown twice: once before the first drill of a level, and again
 * the moment a student gets a question wrong that this tip covers. The second
 * showing is the one that teaches. A trick delivered while the mistake is still
 * warm sticks; the same trick in a textbook chapter does not.
 *
 * Every card is bilingual. English is the default; `vi` exists because most of
 * the first cohort reads Vietnamese faster than English, and a student should
 * never lose a maths point to a language gap.
 */

const TIPS = [
  {
    id: "subtract-hundreds-first",
    skill: "arith.add-subtract",
    en: {
      title: "Subtract the hundreds first, then say the middle number out loud",
      steps: [
        "Take away the big part before the small part.",
        "Say the intermediate number to yourself. That is what stops you dropping a hundred.",
        "Then take away what is left.",
      ],
      example: "823 − 467 → 823 − 400 = 423 → 423 − 60 = 363 → 363 − 7 = 356",
      why: "Rounding up and adding back feels clever but loses a whole hundred when you are rushed. Going left to right never does.",
    },
    vi: {
      title: "Trừ hàng trăm trước, rồi đọc to số ở giữa",
      steps: [
        "Bỏ phần lớn trước, phần nhỏ sau.",
        "Đọc thầm số trung gian. Đó là thứ giữ cho bạn không rơi mất một trăm.",
        "Rồi trừ nốt phần còn lại.",
      ],
      example: "823 − 467 → 823 − 400 = 423 → 423 − 60 = 363 → 363 − 7 = 356",
      why: "Cách làm tròn lên rồi cộng bù nghe thông minh nhưng lúc vội rất hay mất nguyên một trăm. Đi từ trái sang phải thì không bao giờ.",
    },
  },
  {
    id: "split-and-add",
    skill: "arith.multiply",
    en: {
      title: "Split the second number, multiply twice, add",
      steps: [
        "Break the smaller factor into tens and units.",
        "Multiply each part separately.",
        "Add the two results.",
      ],
      example: "17 × 54 → 17 × 50 = 850, 17 × 4 = 68, 850 + 68 = 918",
      why: "Two easy multiplications beat one hard one. You are never holding more than three digits in your head.",
    },
    vi: {
      title: "Tách số thứ hai, nhân hai lần, rồi cộng",
      steps: [
        "Tách thừa số nhỏ hơn thành hàng chục và hàng đơn vị.",
        "Nhân từng phần riêng.",
        "Cộng hai kết quả lại.",
      ],
      example: "17 × 54 → 17 × 50 = 850, 17 × 4 = 68, 850 + 68 = 918",
      why: "Hai phép nhân dễ hơn một phép nhân khó. Bạn không bao giờ phải nhớ quá ba chữ số trong đầu.",
    },
  },
  {
    id: "times-five-and-eleven",
    skill: "arith.multiply",
    en: {
      title: "×5 is half of ×10. ×11 is the digits with their sum in the middle",
      steps: [
        "For ×5: multiply by 10, then halve.",
        "For ×11 on a two-digit number: keep the outer digits, put their sum between them.",
        "If that sum is 10 or more, carry the 1 into the first digit.",
      ],
      example: "48 × 5 → 480 ÷ 2 = 240.   36 × 11 → 3 (3+6) 6 = 396.   78 × 11 → 7 (15) 8 → 858",
      why: "Both turn a multiplication into an addition or a halving, which are far faster under a clock.",
    },
    vi: {
      title: "×5 là một nửa của ×10. ×11 là giữ hai đầu, đặt tổng vào giữa",
      steps: [
        "Với ×5: nhân 10 rồi chia đôi.",
        "Với ×11 số hai chữ số: giữ hai chữ số ngoài, đặt tổng của chúng vào giữa.",
        "Nếu tổng đó từ 10 trở lên thì nhớ 1 sang chữ số đầu.",
      ],
      example: "48 × 5 → 480 ÷ 2 = 240.   36 × 11 → 3 (3+6) 6 = 396.   78 × 11 → 7 (15) 8 → 858",
      why: "Cả hai biến phép nhân thành phép cộng hoặc chia đôi, nhanh hơn hẳn khi có đồng hồ.",
    },
  },
  {
    id: "squares-rule-of-one",
    skill: "arith.squares",
    en: {
      title: "Any square: slide to a round number, then add back",
      steps: [
        "n² = (n − d)(n + d) + d², where d slides n to something round.",
        "Choose d so one factor ends in 0.",
        "The correction d² is always small.",
      ],
      example: "37² → d = 3 → 34 × 40 = 1360 → +9 = 1369.   48² → d = 2 → 46 × 50 = 2300 → +4 = 2304",
      why: "It turns every square outside the memorised table into one easy multiplication by a multiple of ten.",
    },
    vi: {
      title: "Bình phương bất kỳ: trượt về số tròn, rồi cộng bù",
      steps: [
        "n² = (n − d)(n + d) + d², với d là khoảng trượt n về số tròn.",
        "Chọn d sao cho một thừa số kết thúc bằng 0.",
        "Phần bù d² luôn nhỏ.",
      ],
      example: "37² → d = 3 → 34 × 40 = 1360 → +9 = 1369.   48² → d = 2 → 46 × 50 = 2300 → +4 = 2304",
      why: "Nó biến mọi bình phương ngoài bảng đã thuộc thành một phép nhân dễ với bội của mười.",
    },
  },
  {
    id: "cube-root-last-digit",
    skill: "arith.roots",
    en: {
      title: "Cube roots: the last digit gives itself away",
      steps: [
        "A cube's last digit determines the root's last digit uniquely.",
        "0,1,4,5,6,9 map to themselves. Only 2↔8 and 3↔7 swap.",
        "Use the leading digits to find the tens: 5832 is between 10³ and 20³, so the root is 1_.",
      ],
      example: "∛5832 → ends in 2, so root ends in 8 → between 10 and 20 → 18",
      why: "You never divide anything. Two glances and the answer is forced.",
    },
    vi: {
      title: "Căn bậc ba: chữ số cuối tự khai ra",
      steps: [
        "Chữ số cuối của lập phương xác định duy nhất chữ số cuối của căn.",
        "0,1,4,5,6,9 giữ nguyên. Chỉ có 2↔8 và 3↔7 đổi chỗ.",
        "Dùng các chữ số đầu để tìm hàng chục: 5832 nằm giữa 10³ và 20³ nên căn là 1_.",
      ],
      example: "∛5832 → tận cùng 2, nên căn tận cùng 8 → nằm giữa 10 và 20 → 18",
      why: "Không phải chia gì cả. Nhìn hai lần là đáp án bị ép ra.",
    },
  },
  {
    id: "reduce-before-dividing",
    skill: "arith.divide",
    en: {
      title: "Cancel first, divide once",
      steps: [
        "Look for a common factor on both sides before doing any long division.",
        "Halve both numbers as often as they are both even.",
        "Then do the one division that is left.",
      ],
      example: "8 × 240 = 24 × ? → cancel 8 → 240 = 3 × ? → 80",
      why: "Most 4-digit-by-2-digit questions are built to cancel. Grinding through the division is the slow path the setter expects you to take.",
    },
    vi: {
      title: "Rút gọn trước, chia một lần",
      steps: [
        "Tìm thừa số chung hai vế trước khi làm phép chia dài.",
        "Chia đôi cả hai số chừng nào cả hai còn chẵn.",
        "Rồi làm nốt một phép chia còn lại.",
      ],
      example: "8 × 240 = 24 × ? → rút 8 → 240 = 3 × ? → 80",
      why: "Phần lớn câu chia 4 chữ số cho 2 chữ số được dựng để rút gọn được. Cắm đầu chia là con đường chậm mà người ra đề mong bạn đi.",
    },
  },
  {
    id: "fraction-anchors",
    skill: "arith.fractions",
    en: {
      title: "Learn eight anchors, read every percentage off them",
      steps: [
        "1/2 = 50%, 1/3 = 33.3%, 1/4 = 25%, 1/5 = 20%",
        "1/6 = 16.7%, 1/8 = 12.5%, 1/10 = 10%, 1/16 = 6.25%",
        "Everything else is an anchor plus or minus another anchor.",
      ],
      example: "3/8 = 25% + 12.5% = 37.5%.   5/6 = 100% − 16.7% = 83.3%",
      why: "Eight facts cover almost every fraction that appears. Deriving them each time costs seconds you do not have.",
    },

const BY_ID = new Map(TIPS.map((t) => [t.id, t]));
const BY_SKILL = TIPS.reduce((m, t) => {
  (m[t.skill] ||= []).push(t);
  return m;
}, {});

/** One tip card, already resolved to a language. Returns null for unknown ids. */
function getTip(id, lang = "en") {
  const t = BY_ID.get(id);
  if (!t) return null;
  return { id: t.id, skill: t.skill, ...(t[lang] || t.en) };
}

/** Every tip attached to a skill, resolved to a language. */
function tipsForSkill(skillId, lang = "en") {
  return (BY_SKILL[skillId] || []).map((t) => getTip(t.id, lang));
}

Object.assign(__shared, { getTip, tipsForSkill, TIPS });

/* ── src/engine/arithmetic.js ─────────────────────────────────── */
(() => {
/**
 * Mental arithmetic generators.
 *
 * Every generator takes `(rng, level)` and returns a question. Levels run 1 to 3
 * and mean the same thing everywhere: 1 is where a beginner starts and should
 * mostly succeed, 2 is the working level, 3 is where the trick in the tip card
 * stops being optional.
 *
 * Traps are not decoration. Each one is a specific wrong route with a sentence
 * saying what went wrong, so a miss tells the student which mistake they made
 * rather than only that they made one.
 */

const { round4, fact } = __shared;

const q = (o) => ({ traps: [], ...o });

/* ── 1. Times tables ─────────────────────────────────────────────────────── */
function timesTables(rng, level) {
  const hi = level === 1 ? 9 : level === 2 ? 12 : 19;
  const lo = level === 3 ? 11 : 2;
  const a = rng.int(lo, hi);
  const b = rng.int(2, level === 1 ? 9 : 12);
  return q({
    prompt: `${a} × ${b}`,
    answer: a * b,
    traps: [
      { value: a * (b - 1), why: "One row too early in the table." },
      { value: a * (b + 1), why: "One row too far down the table." },
      { value: a + b, why: "Added instead of multiplied." },
    ],
    tip: "split-and-add",
  });
}

/* ── 2. Addition and subtraction ─────────────────────────────────────────── */
function addSubtract(rng, level) {
  const range = [[23, 99], [100, 999], [1000, 9999]][level - 1];
  const isAdd = rng.chance(0.5);
  const a = rng.int(range[0], range[1]);

  if (isAdd) {
    const b = rng.int(range[0], range[1]);
    return q({
      prompt: `${a} + ${b}`,
      answer: a + b,
      traps: [
        { value: a + b - 10, why: "A ten was dropped while carrying." },
        { value: a + b - 100, why: "A hundred was dropped while carrying." },
      ],
      tip: "subtract-hundreds-first",
    });
  }

  // Always positive: the real papers never ask for a negative result, and the
  // sign costs time without testing the technique.
  const b = rng.int(range[0], Math.max(range[0] + 1, a - Math.floor(range[1] / 10)));
  return q({
    prompt: `${a} − ${b}`,
    answer: a - b,
    traps: [
      { value: a - b + 100, why: "A hundred was left in. This is what rounding up and adding back tends to do under time." },
      { value: a - b - 100, why: "A hundred was taken twice." },
      { value: a - b + 10, why: "A borrow was missed in the tens." },
    ],
    tip: "subtract-hundreds-first",
  });
}

/* ── 3. Multiplication ───────────────────────────────────────────────────── */
function multiply(rng, level) {
  if (level === 1) {
    const a = rng.int(12, 99);
    const b = rng.int(3, 9);
    return q({
      prompt: `${a} × ${b}`,
      answer: a * b,
      traps: [
        { value: Math.floor(a / 10) * 10 * b, why: "Only the tens were multiplied; the units were left behind." },
        { value: (a % 10) * b + Math.floor(a / 10) * b, why: "The partial products were added without their place value." },
      ],
      tip: "split-and-add",
    });
  }

  if (level === 2) {
    const a = rng.int(12, 49);
    const b = rng.pick([5, 11, 15, 20, 25, 50, 12, 9, 99]);
    return q({
      prompt: `${a} × ${b}`,
      answer: a * b,
      traps: [
        { value: a * b - a, why: "One copy of the first number is missing. Check the last step of the split." },
        { value: a * b + a, why: `One copy of ${a} too many. Count the parts of the split again.` },
      ],
      tip: "times-five-and-eleven",
    });
  }

  const a = rng.int(23, 99);
  const b = rng.int(23, 99);
  const tens = Math.floor(b / 10) * 10;
  return q({
    prompt: `${a} × ${b}`,
    answer: a * b,
    traps: [
      { value: a * tens, why: "The units part of the second factor was never added." },
      { value: a * (b % 10), why: "Only the units part was used." },
      { value: a * b - a * 10, why: "A ten went missing between the two partial products." },
    ],
    tip: "split-and-add",
  });
}

/* ── 4. Division ─────────────────────────────────────────────────────────── */
function divide(rng, level) {
  if (level === 1) {
    const b = rng.int(2, 9);
    const ans = rng.int(4, 20);
    return q({
      prompt: `${b * ans} ÷ ${b}`,
      answer: ans,
      traps: [{ value: ans * b, why: "Multiplied instead of divided." }],
      tip: "reduce-before-dividing",
    });
  }

  if (level === 2) {
    const b = rng.int(3, 19);
    const ans = rng.int(11, 60);
    return q({
      prompt: `${b * ans} ÷ ${b}`,
      answer: ans,
      traps: [
        { value: ans + 1, why: `One too high. Multiply back to check: ${b} times your answer should return the number you started with.` },
        { value: ans - 1, why: `One too low. Multiply back to check: ${b} times your answer should return the number you started with.` },
      ],
      tip: "reduce-before-dividing",
    });
  }

  const b = rng.int(12, 29);
  const ans = rng.int(21, 99);
  return q({
    prompt: `${b * ans} ÷ ${b}`,
    answer: ans,
    traps: [
      { value: ans + 10, why: "A ten too many in the quotient; the place value slipped." },
      { value: ans - 10, why: "A ten short in the quotient." },
    ],
    tip: "reduce-before-dividing",
  });
}

/* ── 5. Squares ──────────────────────────────────────────────────────────── */
function squares(rng, level) {
  const range = [[11, 25], [21, 40], [26, 59]][level - 1];
  const n = rng.int(range[0], range[1]);
  const d = n % 10 <= 5 ? n % 10 : n % 10 - 10;
  const slid = (n - d) * (n + d); // the rule-of-one product, before adding d²
  return q({
    prompt: `${n}²`,
    answer: n * n,
    traps: [
      { value: slid, why: `The correction was never added. (n−d)(n+d) = ${slid}, and you still owe d² = ${d * d}.` },
      { value: n * n - 2 * n + 1, why: `That is ${n - 1}². Off by one before squaring.` },
      { value: n * 2, why: "Doubled instead of squared." },
    ],
    tip: "squares-rule-of-one",
  });
}

/* ── 6. Roots and powers ─────────────────────────────────────────────────── */
function roots(rng, level) {
  if (level === 1) {
    const n = rng.int(11, 30);
    return q({
      prompt: `√${n * n}`,
      answer: n,
      traps: [{ value: (n * n) / 2, why: "Halved instead of taking a square root." }],
      tip: "squares-rule-of-one",
    });
  }

  if (level === 2) {
    if (rng.chance(0.5)) {
      const n = rng.int(2, 12);
      return q({
        prompt: `${n}³`,
        answer: n ** 3,
        traps: [
          { value: n * n, why: "Squared instead of cubed." },
          { value: n * 3, why: "Multiplied by 3 instead of raising to the third power." },
        ],
        tip: "cube-root-last-digit",
      });
    }
    const [b, e] = rng.pick([[2, rng.int(5, 11)], [3, rng.int(3, 6)], [5, rng.int(3, 5)]]);
    return q({
      prompt: `${b}^${e}`,
      answer: b ** e,
      traps: [
        { value: b ** (e - 1), why: `That is ${b}^${e - 1}. One factor short; the exponent counts the factors, so there are ${e} of them.` },
        { value: b * e, why: "Multiplied the base by the exponent." },
      ],
      tip: "cube-root-last-digit",
    });
  }

  const n = rng.int(11, 25);
  const cube = n ** 3;
  const lastDigitTrap = { 2: 2, 3: 3, 7: 7, 8: 8 }[n % 10];
  const traps = [{ value: Math.round(cube / 3), why: "Divided by 3 instead of taking a cube root." }];
  if (lastDigitTrap != null) {
    traps.unshift({
      value: n - (n % 10) + lastDigitTrap,
      why: "The last digit of a cube swaps 2 with 8 and 3 with 7. It does not stay put.",
    });
  }
  return q({
    prompt: `∛${cube.toLocaleString("en-US")}`,
    answer: n,
    traps,
    tip: "cube-root-last-digit",
  });
}

/* ── 7. Fractions ────────────────────────────────────────────────────────── */
const DENOMS = [2, 4, 5, 8, 10, 16, 20, 25, 40, 50];

function fractions(rng, level) {
  if (level === 1) {
    const d = rng.pick([2, 4, 5, 8, 10]);
    const n = rng.int(1, d - 1);
    return q({
      prompt: `${n}/${d} as a decimal`,
      answer: round4(n / d),
      traps: [{ value: round4(d / n), why: "The fraction was read upside down." }],
      tip: "fraction-anchors",
    });
  }

  const d1 = rng.pick(DENOMS);
  const d2 = rng.pick(DENOMS);
  const n1 = rng.int(1, d1 - 1);
  const n2 = rng.int(1, d2 - 1);

  if (level === 2) {
    return q({
      prompt: `${n1}/${d1} × ${n2}/${d2}`,
      answer: round4((n1 * n2) / (d1 * d2)),
      traps: [
        { value: round4(n1 / d1 + n2 / d2), why: "Added instead of multiplied." },
        { value: round4((n1 * n2) / (d1 + d2)), why: "Denominators were added, not multiplied." },
      ],
      tip: "fraction-anchors",
    });
  }

  return q({
    prompt: `${n1}/${d1} + ${n2}/${d2}`,
    answer: round4(n1 / d1 + n2 / d2),
    traps: [
      { value: round4((n1 + n2) / (d1 + d2)), why: "Tops added and bottoms added. Fractions do not work that way; you need a common denominator." },
      { value: round4((n1 * n2) / (d1 * d2)), why: "Multiplied instead of added." },
    ],
    tip: "fraction-anchors",
  });
}

/* ── 8. Percentages ──────────────────────────────────────────────────────── */
function percent(rng, level) {
  if (level === 1) {
    const p = rng.pick([10, 20, 25, 50, 5]);
    const y = rng.pick([40, 60, 80, 120, 200, 240, 400, 500]);
    return q({
      prompt: `${p}% of ${y}`,
      answer: round4((p * y) / 100),
      traps: [
        { value: round4((p * y) / 10), why: "Out by a factor of ten. Per cent means per hundred." },
        { value: round4(y / p), why: "Divided by the percentage instead of taking that share of it." },
      ],
      tip: "percent-flip",
    });
  }

  if (level === 2) {
    const p = rng.pick([12.5, 15, 30, 35, 40, 45, 60, 75, 80, 90, 2.5, 7.5, 17.5]);
    const y = rng.pick([64, 96, 150, 160, 250, 320, 360, 480, 640, 800, 1200]);
    return q({
      prompt: `${p}% of ${y}`,
      answer: round4((p * y) / 100),
      traps: [{ value: round4((p * y) / 1000), why: "Out by a factor of ten." }],
      tip: "percent-flip",
    });
  }

  const y = rng.pick([40, 50, 80, 120, 160, 200, 250, 400, 500, 800]);
  let x = rng.pick([2, 4, 5, 8, 10, 16, 20, 25, 32, 40, 50, 60, 75, 100, 120, 150, 200]);
  x = Math.min(x, y);
  return q({
    prompt: `${x} is what % of ${y}`,
    answer: round4((100 * x) / y),
    traps: [
      { value: round4((100 * y) / x), why: "The two numbers were swapped. The number after 'of' is the whole." },
      { value: round4(x / y), why: "The share is right but it was never turned into a percentage." },
    ],
    tip: "percent-flip",
  });
}

/* ── 9. Estimation ───────────────────────────────────────────────────────── */
function estimate(rng, level) {
  const kind = level === 1 ? rng.pick(["div", "div", "sqrt"]) : rng.pick(["div", "mul", "sqrt"]);
  if (kind === "div") {
    const a = rng.int(1000, 9999);
    const b = rng.int(11, 97);
    return q({ prompt: `≈ ${a} ÷ ${b}`, answer: a / b, approx: true, tip: "reduce-before-dividing" });
  }
  if (kind === "mul") {
    const a = rng.int(101, 999);
    const b = rng.int(11, 99) / 100;
    return q({ prompt: `≈ ${a} × ${b}`, answer: a * b, approx: true, tip: "percent-flip" });
  }
  const a = rng.int(150, 9000);
  return q({ prompt: `≈ √${a}`, answer: Math.sqrt(a), approx: true, tip: "squares-rule-of-one" });
}

/* ── 10. Puzzles: missing digit, balance, two quantities ─────────────────── */
function maskDigit(rng, n) {
  const s = String(n);
  const i = s.length > 1 ? rng.int(1, s.length - 1) : 0; // never mask the leading digit
  return [s.slice(0, i) + "□" + s.slice(i + 1), +s[i]];
}

function puzzles(rng, level) {
  const kinds = level === 1 ? ["balance"] : level === 2 ? ["balance", "missing"] : ["missing", "relation", "largest"];
  const kind = rng.pick(kinds);

  if (kind === "balance") {
    for (let t = 0; t < 60; t++) {
      const a = rng.pick([2, 3, 4, 5, 6, 8]);
      const c = rng.pick([8, 12, 15, 16, 20, 24, 25, 32, 40, 45]);
      const ans = rng.int(11, 99);
      if ((c * ans) % a) continue;
      const b = (c * ans) / a;
      if (b < 20 || b > 999) continue;
      return q({
        prompt: `${a} × ${b} = ${c} × ?`,
        answer: ans,
        traps: [
          { value: round4((a * b) / c + 1), why: "Off by one in the final division." },
          { value: a * b, why: "The left side was computed but never divided by the right factor." },
        ],
        tip: "reduce-before-dividing",
      });
    }
    return q({ prompt: "2 × 232 = 16 × ?", answer: 29, tip: "reduce-before-dividing" });
  }

  if (kind === "missing") {
    if (rng.chance(0.4)) {
      const a = rng.pick([20, 25, 30, 40, 50, 60, 70, 80, 120, 150]);
      const b = rng.int(105, 989);
      const [masked, digit] = maskDigit(rng, b);
      return q({
        prompt: `${a} × ${masked} = ${a * b}`,
        answer: digit,
        hint: "digit",
        tip: "split-and-add",
      });
    }
    const a = rng.int(1000, 9999);
    const b = rng.int(100, 989);
    const [masked, digit] = maskDigit(rng, a);
    const plus = rng.chance(0.5);
    return q({
      prompt: plus ? `${masked} + ${b} = ${a + b}` : `${masked} − ${b} = ${a - b}`,
      answer: digit,
      hint: "digit",
      tip: "subtract-hundreds-first",
    });
  }

  if (kind === "relation") {
    for (let t = 0; t < 80; t++) {
      const b1 = rng.pick([160, 200, 240, 320, 400, 480]);
      const fr = rng.pick([[1, 4], [3, 8], [1, 2], [5, 8], [3, 4], [2, 5], [1, 5]]);
      const b2 = rng.pick([120, 160, 200, 240, 260, 300, 400]);
      const p = rng.pick([10, 15, 20, 25, 30, 35, 40, 45, 50, 60, 75]);
      const A = (b1 * fr[0]) / fr[1];
      const B = (b2 * p) / 100;
      if (A - B < 1) continue;
      return q({
        prompt: `A = ${fr[0]}/${fr[1]} of ${b1},  B = ${p}% of ${b2}.  A − B`,
        answer: round4(A - B),
        traps: [
          { value: round4(B - A), why: "Subtracted the wrong way round." },
          { value: round4(A + B), why: "Added instead of subtracted." },
        ],
        tip: "fraction-anchors",
      });
    }
    return q({ prompt: "A = 3/4 of 200,  B = 35% of 260.  A − B", answer: 59, tip: "fraction-anchors" });
  }

  // largest: comparing powers, answered by letter
  const lo = rng.int(3, 5);
  const items = [];
  for (let b = lo; b < lo + 4; b++) items.push([`${b}^${lo + 7 - b}`, Math.pow(b, lo + 7 - b)]);
  const plain = rng.int(150, 900);
  items.push([String(plain), plain]);
  rng.shuffle(items);
  let best = 0;
  for (let i = 1; i < items.length; i++) if (items[i][1] > items[best][1]) best = i;
  return q({
    prompt: "Which is largest?",
    options: items.map((it) => it[0]),
    answer: "abcde"[best],
    format: "letter",
    tip: null,
    traps: [],
    note: "Comparing only the bases is not enough: 4^7 beats 3^7 and also beats 6^5. Work each one out.",
  });
}

  "arith.roots": roots,
  "arith.fractions": fractions,
  "arith.percent": percent,
  "arith.estimate": estimate,
  "arith.puzzles": puzzles,
};

Object.assign(__shared, { timesTables, addSubtract, multiply, divide, squares, roots, fractions, percent, estimate, puzzles, ARITHMETIC });
